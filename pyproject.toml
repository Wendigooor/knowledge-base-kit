[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-kit"
version = "0.1.0"
description = "Knowledge Base Kit — инструмент для управления персональными базами знаний на базе ChromaDB"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ihar Zvezdzin", email = "ihar.zvezdzin@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Database :: Front-Ends",
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "pygit2>=1.12",
    "rich>=13.0",
    "dataclasses-json>=0.5",
]

[project.scripts]
kbk = "kbk.cli:cli"

[project.urls]
Homepage = "https://github.com/iharzvezdzin/knowledge-base-kit"
Repository = "https://github.com/iharzvezdzin/knowledge-base-kit.git"

[tool.setuptools.packages.find]
include = ["kbk*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
strict = false
ignore_missing_imports = true
python_version = "3.11"
